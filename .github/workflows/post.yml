name: Post to Instagram

on:
  # Runs at 09:00 UTC (12:00 in Kenya) on the 1st, 4th, 7th ... of each month.
  # That is roughly every 3 days. GitHub may delay it by up to an hour.
  schedule:
    - cron: "0 9 1,4,7,10,13,16,19,22,25,28 * *"

  # Lets you press a button to run it manually - use this for testing.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (write a caption but do NOT post)"
        type: boolean
        default: true

permissions:
  contents: write   # needed so the bot can save which photo it used

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # Only the one matching CAPTION_PROVIDER in post.py needs to exist.
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python post.py --dry-run
          else
            python post.py
          fi

      - name: Remember which photo was used
        if: inputs.dry_run != true
        run: |
          git config user.name "furaha-bot"
          git config user.email "furaha-bot@users.noreply.github.com"
          git add state/posted.json
          git diff --staged --quiet || git commit -m "Posted a photo"
          git push
